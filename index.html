/* V30 · THE NORTHSIDE FINALE (original art, non-blocking credits) */

.endgame-stage{position:relative;width:min(100%,520px);height:100dvh;max-height:1100px;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;padding:calc(env(safe-area-inset-top) + 12px) 15px calc(env(safe-area-inset-bottom) + 15px)}

.endgame-window{position:relative;flex:1;min-height:0;overflow:hidden;mask-image:linear-gradient(to bottom,transparent,black 8%,black 88%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,black 8%,black 88%,transparent)}

.endgame-pizza canvas{display:block;width:min(100%,91px);aspect-ratio:1;margin:0 auto 5px;filter:drop-shadow(0 4px 7px #0006)}

.endgame-crown{font-size:30px;filter:drop-shadow(0 0 10px #ffe7a3);animation:finaleFloat 2.5s ease-in-out infinite}
.endgame-cleared{font-weight:1000;font-size:clamp(31px,9vw,49px);line-height:1;letter-spacing:.06em;background:linear-gradient(#fffde9 20%,#f9c75c 65%,#c78125);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 10px 25px #ffce6a38;animation:finalePop .7s cubic-bezier(.2,1.45,.5,1) both}
.endgame-ribbon{border:1px solid #ffdb83a8;color:#fbe6ae;background:#ffce5225;font-weight:950;font-size:11px;border-radius:99px;padding:7px 13px;letter-spacing:.1em}

.endgame-reveal .endgame-name{font-size:clamp(24px,8vw,35px);line-height:1.15;font-weight:1000;text-shadow:0 5px 25px #ffc15c80}
.endgame-hero-pizza{height:min(35vh,257px);width:min(35vh,257px);min-height:132px;min-width:132px;max-width:80vw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff8c5a8,#f6cb5920 62%,transparent 74%);filter:drop-shadow(0 10px 16px #04081199);animation:finaleFloat 2.9s ease-in-out infinite}
.endgame-hero-pizza canvas{width:100%;height:100%}
.endgame-final-stat{font-weight:900;font-size:12px;color:#f3d9a4;background:#ffffff12;border:1px solid #ffffff28;border-radius:12px;padding:9px 12px;width:100%}
.endgame-final-copy{font-size:12px;color:#dae8f6;line-height:1.5;margin:5px 0}
.endgame-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.endgame-particle{position:absolute;left:var(--x);top:-12%;width:var(--w);height:var(--h);background:var(--c);border-radius:2px;opacity:.96;transform:rotate(var(--rot));animation:finaleFall var(--duration) linear infinite;animation-delay:var(--delay)}
.endgame-flare{position:absolute;left:50%;top:41%;width:105vmin;height:105vmin;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(#ffd76c26 0deg 6deg,transparent 6deg 20deg);animation:finaleHalo 14s linear infinite;pointer-events:none}
.endgame-reveal-content{position:relative;z-index:4;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
@keyframes finaleRoll{from{transform:translateY(47vh)}to{transform:translateY(-100%)}}
@keyframes finaleProgress{from{width:0}to{width:100%}}
@keyframes finaleFall{0%{transform:translate3d(0,-5vh,0) rotate(0);opacity:1}100%{transform:translate3d(var(--drift),115vh,0) rotate(610deg);opacity:.8}}
@keyframes finaleHalo{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes finalePop{from{opacity:0;transform:scale(.28) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes finaleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

// Migrate only pre-V28 pizzas in progress: the teriyaki recipe used roast chicken.
// This keeps old draft, oven, and cut pizzas fulfillable after loading the updated recipe.
function migrateLegacyTeriyaki(state){
  const recipeIndex=REC.findIndex(r=>r.n==='テリヤキチキン');
  for(const item of [state.draft,...(state.ovens||[]),state.cut]){
    if(!item||item.recipe!==recipeIndex||!Array.isArray(item.toppings))continue;
    if(item.toppings.includes('chicken')&&!item.toppings.includes('teriyakiChicken')){
      item.toppings=item.toppings.map(t=>t==='chicken'?'teriyakiChicken':t);
    }
  }
  state.teriRecipeRevision=28;
}
function migrateDoughOrderState(state,sourceRevision){
  if(!state||Number(sourceRevision)>=38)return;
  // Orders / pizzas in V37 had no crust-style field: treat them as hand-toss R.
  for(const order of (state.orders||[]))order.dough=doughCode(order.dough);
  if(state.draft){
    state.draft.dough=doughCode(state.draft.dough);
    if(Number.isInteger(state.draft.stage))state.draft.stage=Math.min(4,state.draft.stage+1);
  }
  for(const item of [...(state.ovens||[]),state.cut])if(item)item.dough=doughCode(item.dough);
  state.doughRevision=38;
}
// Migrate only this unlocked hidden recipe from the former formal L selection.
// Do not disturb other L orders, dough state, toppings, or completed cuts.
function migrateSecretFormalSize(state){
  if(!state||!career.secretMenuUnlocked)return;
  const idx=REC.findIndex(recipe=>recipe.secret);
  if(idx<0)return;
  for(const entry of [...(state.orders||[]),state.draft,...(state.ovens||[]),state.cut]){
    if(entry?.recipe===idx)entry.size='M';
  }
  state.secretSizeRevision=43;
}
// V44: Ultracheese orders are always hand-toss (R).  Update previously saved
// orders together with any partially prepared, baking or cut counterparts.
// Idempotent and safe to run on every resume, including portable restores.
function migrateUltraCheeseHandToss(state){
  if(!state)return;
  const idx=REC.findIndex(recipe=>recipe.n==='ウルトラチーズ');
  if(idx<0)return;
  for(const entry of [...(state.orders||[]),state.draft,...(state.ovens||[]),state.cut]){
    if(entry?.recipe===idx)entry.dough='R';
  }
  state.ultraHandTossRevision=44;
}

// V15: recognize newly unlocked recipes and introduce each pizza at the moment it becomes available.
// The queue lives in the existing career save, so closing the app mid-celebration does not lose it.
let unlockAnnouncementOpen=false;
let unlockWasPaused=false;
function pendingRecipeIds(){
  if(!Array.isArray(career.pendingUnlocks))career.pendingUnlocks=[];
  return career.pendingUnlocks;
}
function queueNewRecipes(oldLevel,newLevel){
  // Reaching a sales threshold during a shift is not a release. The menu only
  // changes AFTER closing; work-in-progress orders remain on the old menu.
  if(S && S.running)return;
  const previous=menuUnlockLevel();
  const reached=Math.min(LEVEL_CAP,Math.max(previous,Math.floor(Number(newLevel)||previous)));
  if(reached<=previous)return;
  const pending=pendingRecipeIds();
  REC.forEach((recipe,index)=>{
    if(recipe.unlock>previous && recipe.unlock<=reached && !pending.includes(index))pending.push(index);
  });
  career.menuUnlockLevel=reached;
  persist();
}

}
function showUnlockAnnouncement(){

  if(!pending.length){

      unlockAnnouncementOpen=false;
      if(S && S.running)S.paused=unlockWasPaused;
      last=performance.now();

// V34: equal pay for every employee. First hire (LV5) starts at 1,000 yen/hour,
// then the hourly wage rises by 5 yen at every subsequent level, up to LV100.
// Actual pay accrues only for scheduled work (and any accepted job being finished).
const STAFF_UNLOCK_LEVELS=[5,25,50,75];
const STAFF_HIRE_COSTS=[12000,32000,75000,140000];
const STAFF_START_LEVEL=5, STAFF_BASE_HOURLY=1000, STAFF_RAISE_PER_LEVEL=5;
function normalizeStaffShift(raw,fallback='full'){
  const value=raw&&typeof raw==='object'?raw:{};
  if(Object.prototype.hasOwnProperty.call(STAFF_SHIFT_MODES,value.mode))return {mode:value.mode};
  if(value.mode==='custom'){
    // Preserve the intent of V32 custom shifts without exposing a sixth choice.
    const start=Math.max(11,Math.min(22,Math.floor(Number(value.start)||12)));
    const end=Math.max(start+1,Math.min(23,Math.floor(Number(value.end)||20)));
    const oldHours=Array.from({length:12},(_,i)=>i+11).filter(h=>h>=start&&h<end);
    const close=levelForTotal(career.total)<=40?22:23;
    const candidates={off:[],full:Array.from({length:close-11},(_,i)=>i+11),lunch:[12],dinner:[18],peaks:[12,18]};
    const options=Object.entries(candidates).map(([mode,hours])=>({mode,loss:oldHours.filter(h=>!hours.includes(h)).length+hours.filter(h=>!oldHours.includes(h)).length}));
    options.sort((a,b)=>a.loss-b.loss);
    return {mode:options[0].mode};
  }
  return {mode:Object.prototype.hasOwnProperty.call(STAFF_SHIFT_MODES,fallback)?fallback:'full'};
}
function staffShiftBlocks(shift,close=shiftCloseHour()){
  const cfg=normalizeStaffShift(shift),finish=Math.max(22,Math.min(23,Math.floor(close)));
  const input=cfg.mode==='off'?[]:
    cfg.mode==='lunch'?[[12,13]]:
    cfg.mode==='dinner'?[[18,19]]:
    cfg.mode==='peaks'?[[12,13],[18,19]]:[[11,finish]];
  return input.map(([a,b])=>[Math.max(11,Math.min(finish,a)),Math.max(11,Math.min(finish,b))]).filter(([a,b])=>b>a);
}
function staffCap(){return Math.min(4,STAFF_UNLOCK_LEVELS.filter(req=>level()>=req).length)}
function staffHireCost(){return STAFF_HIRE_COSTS[Math.min(3,career.staff||0)]}
// index is accepted for compatibility with older staff-management UI; all workers earn the same rate.
function staffHourlyRate(index){return STAFF_BASE_HOURLY+STAFF_RAISE_PER_LEVEL*Math.max(0,level()-STAFF_START_LEVEL)}
function staffWage(index){return staffHourlyRate(index)*((S?.shiftCloseHour===22?22:level()<=40?22:23)-11)}
function currentStaffShift(i){return normalizeStaffShift((S&&(S.running||S.elapsed===0)?S.staffSchedule?.[i]:career.staffShifts?.[i])||career.staffShifts?.[i]);}
function staffOnDuty(i,elapsed=S?.elapsed||0){
  if(i<0||i>=Math.min(4,career.staff||0))return false;
  const schedule=S?.staffSchedule?.[i]||career.staffShifts?.[i];
  return staffShiftBlocks(schedule).some(([a,b])=>elapsed>=(a-11)*21600&&elapsed<(b-11)*21600);
}
function staffOnDutyCount(elapsed=S?.elapsed||0){let total=0;for(let i=0;i<Math.min(career.staff||0,staffCap(),4);i++)if(staffOnDuty(i,elapsed))total++;return total}
function staffShiftText(shift,close=shiftCloseHour()){
  const blocks=staffShiftBlocks(shift,close);
  return blocks.length?blocks.map(([a,b])=>`${a}:00–${b}:00`).join(' ／ '):'お休み';
}
function staffScheduledHours(shift,close=shiftCloseHour()){
  return staffShiftBlocks(shift,close).reduce((sum,[a,b])=>sum+b-a,0);
}
function staffMinutesInRange(i,begin,end,includeJob=true){
  if(end<=begin)return 0;
  const intervals=staffShiftBlocks(S.staffSchedule?.[i]||career.staffShifts?.[i]).map(([a,b])=>[(a-11)*21600,(b-11)*21600]);
  const job=S.workers?.[i];
  if(includeJob&&job&&Number.isFinite(job.startedAt)&&Number.isFinite(job.finishAt)&&job.finishAt>job.startedAt)intervals.push([job.startedAt,job.finishAt]);
  intervals.sort((a,b)=>a[0]-b[0]);
  let covered=0,last=begin;
  for(const [a,b] of intervals){
    const lo=Math.max(begin,a,last),hi=Math.min(end,b);
    if(hi>lo){covered+=hi-lo;last=hi;}
  }
  return covered;
}
function accrueStaffWages(before,after){
  if(!S||after<=before)return;
  if(!Number.isFinite(S.staffCostAccrued))S.staffCostAccrued=0;
  if(!Array.isArray(S.staffWorkedHours))S.staffWorkedHours=[0,0,0,0];
  for(let i=0;i<Math.min(career.staff||0,4);i++){
    const gameMillis=staffMinutesInRange(i,before,after);
    if(gameMillis<=0)continue;
    S.staffCostAccrued+=staffHourlyRate(i)*gameMillis/21600;
    S.staffWorkedHours[i]=(Number(S.staffWorkedHours[i])||0)+gameMillis/21600;
  }
}
function staffPayroll(){return Math.max(0,Math.round(Number(S?.staffCostAccrued)||0))}
function staffProjectedPayroll(){
  if(!S)return 0;
  const close=S.shiftCloseHour===22?22:23;
  if(!S.running&&S.elapsed>=shiftDuration()){
    const nextClose=level()<=40?22:23;
    return Math.round(Array.from({length:Math.min(career.staff||0,4)},(_,i)=>staffHourlyRate(i)*staffScheduledHours(career.staffShifts[i],nextClose)).reduce((a,b)=>a+b,0));
  }
  const start=Math.max(0,Math.min(shiftDuration(),S.elapsed));
  let projected=Number(S.staffCostAccrued)||0;
  for(let i=0;i<Math.min(career.staff||0,4);i++)projected+=staffHourlyRate(i)*staffMinutesInRange(i,start,shiftDuration())/21600;
  return Math.round(projected);
}
function staffShiftEditor(){
  if(!career.staff)return '<p class="staff-empty">スタッフを雇うと5種類のシフトから勤務時間を設定できます。採用直後は12〜13時と18〜19時の勤務です。</p>';
  const close=(S?.running||!S?.elapsed)?shiftCloseHour():(level()<=40?22:23);
  return Array.from({length:Math.min(career.staff,4)},(_,i)=>{
    const cfg=currentStaffShift(i),hours=staffScheduledHours(cfg,close);
    const active=S?.running&&staffOnDuty(i),busy=!!S?.workers?.[i];
    const options=Object.entries(STAFF_SHIFT_MODES).map(([k,v])=>`<option value="${k}" ${cfg.mode===k?'selected':''}>${v}</option>`).join('');
    return `<div class="staff-shift-card"><div class="staff-shift-top"><strong>👩‍🍳 スタッフ ${i+1}</strong><span class="staff-duty-status ${active?'on':busy?'busy':''}">${busy?'🔪 調理中':active?'● 勤務中':'○ 勤務外'}</span></div>
      <label class="staff-shift-label" for="staffShift${i}">シフト（5種類）</label>
      <select id="staffShift${i}" data-staff-shift="${i}" class="staff-shift-select">${options}</select>
      <div class="staff-shift-meta"><span>${staffShiftText(cfg,close)}<br><small>時給 ${yen(staffHourlyRate(i))} · ${hours}時間</small></span><strong>予定 ${yen(staffHourlyRate(i)*hours)}</strong></div>
    </div>`;
  }).join('');
}
function changeStaffShift(i,field,value,refresh){
  if(!Number.isInteger(i)||i<0||i>=Math.min(career.staff||0,4))return;
  if(field!=='mode'||!Object.prototype.hasOwnProperty.call(STAFF_SHIFT_MODES,value))return;
  const cfg=normalizeStaffShift({mode:value});
  career.staffShifts[i]={...cfg};
  if(S&&(S.running||S.elapsed===0)){
    if(!Array.isArray(S.staffSchedule))S.staffSchedule=[];
    S.staffSchedule[i]={...cfg};
  }
  persist();refresh();
}
function hydrateStaffShiftState(target,old){
  target.staffSchedule=Array.from({length:4},(_,i)=>normalizeStaffShift(old.staffSchedule?.[i]||career.staffShifts?.[i]));
  target.staffWorkedHours=Array.isArray(old.staffWorkedHours)?Array.from({length:4},(_,i)=>Math.max(0,Number(old.staffWorkedHours[i])||0)):[0,0,0,0];
  target.staffSales=Number.isFinite(Number(old.staffSales))?Math.max(0,Number(old.staffSales)):0;
  // V31 deducted a flat wage at closing. Convert the already elapsed part to the new hourly economy.
  if(!Number.isFinite(Number(old.staffCostAccrued))){
    target.staffCostAccrued=0;
    const until=Math.max(0,Math.min(shiftDuration(),target.elapsed||0));
    for(let i=0;i<Math.min(4,career.staff||0);i++){
      const served=staffMinutesInRange(i,0,until);
      target.staffWorkedHours[i]=served/21600;
      target.staffCostAccrued+=staffHourlyRate(i)*served/21600;
    }
  }else target.staffCostAccrued=Math.max(0,Number(old.staffCostAccrued));
  target.staffShiftRevision=34;
}
function staffDuration(){
  const levelFactor=(level()-1)/99;
  // Skilled staff produce more pizzas at higher levels, offsetting rising wages.
  // No extra training speed at LV25 and below; max +65% speed from LV75 onward.
  const trainingProgress=Math.min(1,Math.max(0,(level()-25)/50));
  const trainingBoost=1+0.65*trainingProgress;
  return (31000-levelFactor*18500)/((1+.05*(career.uniform||0))*trainingBoost)+Math.random()*2500;
}
function staffActionReady(){if(!Array.isArray(S.workers))S.workers=[];
  if(!Number.isFinite(S.staffServed))S.staffServed=0;
  if(!Number.isFinite(S.wasted))S.wasted=0;
  if(!Number.isFinite(S.staffSales))S.staffSales=0;
}
function updateStaff(){
  if(!S.running||S.paused||unlockAnnouncementOpen)return;
  staffActionReady();let touched=false;let completions=[];
  const count=Math.min(career.staff||0,staffCap(),4);
  // Finish a ticket even if its worker's shift has just ended: overtime is billed.
  for(let i=0;i<count;i++){
    const worker=S.workers[i];
    if(worker&&S.elapsed>=worker.finishAt){
      const o=S.orders.find(o=>o.id===worker.orderId&&o.status==='staff');
      S.workers[i]=null;touched=true;
      if(o){
        const before=level(),r=REC[o.recipe];
        const price=pizzaPrice(r,o.size);S.sales+=price;S.staffSales+=price;career.total+=price;S.served++;S.staffServed++;
        S.orders=S.orders.filter(x=>x.id!==o.id);
        completions.push({name:orderDisplayName(o),price,before});
        if(S.selected===o.id)S.selected=S.orders.find(x=>x.status==='wait')?.id||null;
      }
    }
  }
  // Only scheduled on-duty workers may pick up a new order.
  for(let i=0;i<count;i++){
    if(S.workers[i]||career.stock<=0||!staffOnDuty(i))continue;
    const o=S.orders.find(x=>x.status==='wait'&&x.id!==S.draft?.id);
    if(!o)break;
    o.status='staff';
    S.workers[i]={orderId:o.id,startedAt:S.elapsed,finishAt:S.elapsed+staffDuration()*(pizzaSize(o.size)==='L'?1.17:pizzaSize(o.size)==='S'?.88:1)*(doughCode(o.dough)==='P'?1.1:doughCode(o.dough)==='U'?.92:1)};
    career.stock--;touched=true;
    if(S.selected===o.id)S.selected=S.orders.find(x=>x.status==='wait')?.id||null;
  }
  if(touched){render();persist()}
  const busyField=$('#staffProcessing'),doneField=$('#staffAutoCount');
  if(busyField)busyField.textContent=String(S.workers.filter(Boolean).length);
  if(doneField)doneField.textContent=String(S.staffServed);
  if($('#staffWagesLive'))$('#staffWagesLive').textContent=yen(staffPayroll());
  if($('#staffWagesExpected'))$('#staffWagesExpected').textContent=yen(staffProjectedPayroll());
  if($('#staffOnDuty'))$('#staffOnDuty').textContent=String(staffOnDutyCount());
  if($('#staffRevenueLive'))$('#staffRevenueLive').textContent=yen(S.staffSales);
  const hud=$('#staffhud');if(hud&&career.staff){hud.textContent='👩‍🍳 '+staffOnDutyCount()+'人勤務';hud.title='勤務中 '+staffOnDutyCount()+' 人 / 調理中 '+S.workers.filter(Boolean).length+' 人'}
  if(completions.length){
    const lastCompleted=completions.at(-1);
    notify('👩‍🍳 '+lastCompleted.name+' を提供 +'+yen(lastCompleted.price));
    sound('cash');
    const start=Math.min(...completions.map(x=>x.before));
    queueNewRecipes(start,level());
  }
}
// Trashing a failed item restores the customer's ticket: a replacement can be made.
// Stock has been consumed when dough is put down / when a staff job is accepted.
function discardPizza(where,id){
  let item=null,order=null;
  if(where==='draft'){
    item=S.draft;if(!item||!item.failed)return;
    // Legacy saved in-progress pizzas may have been created before stock reservation.
    if(!item.stockTaken&&career.stock>=orderQuantity(item)){career.stock-=orderQuantity(item);item.stockTaken=true}
    order=S.orders.find(o=>o.id===item.id);
    S.draft=null;S.showExtras=false;
  }else if(where==='oven'){
    const i=S.ovens.findIndex(x=>x.id===id);if(i<0)return;
    item=S.ovens[i];
    if(item.ok&&S.elapsed-item.at<bakeTime()+24000)return;
    order=S.orders.find(o=>o.id===item.id);
    S.ovens.splice(i,1);
  }else if(where==='cut'){
    item=S.cut;
    if(!item||(!item.burn&&prepIsRight(item)&&!item.cutFailed&&!item.finishFailed&&item.cuts<=pizzaCutCountFor(item)))return;
    order=S.orders.find(o=>o.id===item.id);
    S.cut=null;S.showFinishExtras=false;
  }else return;
  if(order)order.status='wait';
  if(!S.draft)S.selected=item.id;
  S.miss++;S.soloStreak=0;S.wasted=(S.wasted||0)+orderQuantity(item);
  sound('error');notify('🗑️ 破棄しました。注文は残っています');
  render();persist();
}


// V22: Preserve old saves across upgrades whenever storage is shared, and provide
// an explicit portable backup/import for iOS/Safari when file origins are isolated.
const RECOVERY_KEY='northside_mobile_recovery_snapshots_v22';
const SAVE_LABEL='NORTHSIDE_PIZZA_SAVE';
const CAREER_KEYS=[STORE,'northside_mobile_career_v10','northside_mobile_career_v9','northside_mobile_career_v8','northside_mobile_career_v7','northside_mobile_career_v6'];
const SHIFT_KEYS=[SHIFT_STORE,'northside_mobile_shift_v12','northside_mobile_shift_v11','northside_mobile_shift_v10'];
let localSavingAvailable=true;
try{const key='northside_storage_test_v22';localStorage.setItem(key,'1');localStorage.removeItem(key)}catch(e){localSavingAvailable=false}
function parseJsonMaybe(raw){try{return JSON.parse(raw)}catch(e){return null}}
function isObject(x){return !!x&&typeof x==='object'&&!Array.isArray(x)}
function isCareer(x){return isObject(x)&&Number.isFinite(Number(x.day))&&Number(x.day)>=1&&Number.isFinite(Number(x.total))&&Number(x.total)>=0&&Number.isFinite(Number(x.cash))}
function saveProgress(c){return (Number(c?.total)||0)*1000000+(Number(c?.day)||1)*100+((Number(c?.cash)||0)>5000?1:0)}
function findLocalLegacy(){
  let best=null,bestKey=null;
  for(const key of CAREER_KEYS){
    let c=null;try{c=parseJsonMaybe(localStorage.getItem(key))}catch(e){}
    if(isCareer(c)&&(!best||saveProgress(c)>saveProgress(best))){best=c;bestKey=key}
  }
  if(!best)return null;
  let shift=null;
  for(const key of SHIFT_KEYS){
    try{const x=parseJsonMaybe(localStorage.getItem(key));if(isObject(x)&&x.day===best.day&&isObject(x.state)){shift=x;break}}catch(e){}
  }
  return {career:best,shift,key:bestKey};
}
const initialOldSave=findLocalLegacy();
if(initialOldSave&&(!hasSavedProfile||!isCareer(save))){
  // Reuse the original v11 career directly; upgrade metadata is retained.
  save=initialOldSave.career;
  career=Object.assign(freshCareer(),initialOldSave.career);
  hasSavedProfile=true;
  if(initialOldSave.shift)existingShift=initialOldSave.shift;
}
ensureDailyRecords();
function getRecoverySnapshots(){try{const x=parseJsonMaybe(localStorage.getItem(RECOVERY_KEY));return Array.isArray(x)?x:[]}catch(e){return []}}
function currentPortableSave(){
  let shift=null;
  if(sessionStarted&&S){shift={version:13,day:career.day,savedAt:Date.now(),state:S}}
  else if(existingShift&&existingShift.day===career.day){shift=existingShift}
  return {format:SAVE_LABEL,formatVersion:22,savedAt:new Date().toISOString(),career:JSON.parse(JSON.stringify(career)),shift:shift?JSON.parse(JSON.stringify(shift)):null};
}
function archivePortable(data,reason){
  if(!localSavingAvailable||!data||!isCareer(data.career))return;
  try{
    let records=getRecoverySnapshots();
    const fingerprint=JSON.stringify([data.career.day,data.career.total,data.career.cash,data.career.owned,data.career.staff]);
    records=records.filter(x=>x.fingerprint!==fingerprint);
    records.unshift({savedAt:new Date().toISOString(),reason:reason||'auto',fingerprint,data});
    localStorage.setItem(RECOVERY_KEY,JSON.stringify(records.slice(0,6)));
  }catch(e){}
}
if(hasSavedProfile)archivePortable(currentPortableSave(),'更新前の保護');
function fromPortableText(raw){
  if(typeof raw!=='string'||raw.length>3000000)throw Error('データが大きすぎます');
  let obj=parseJsonMaybe(raw.trim().replace(/^\uFEFF/,''));
  if(!obj)throw Error('正しいJSON形式のセーブコードではありません');
  // Accept both a portable V22 backup and a raw legacy career JSON.
  const original=isObject(obj.career)?obj.career:obj;
  if(!isCareer(original))throw Error('NORTHSIDE PIZZAのセーブデータを確認できません');
  const val=(k,defaultValue,low=-1e12,high=1e12)=>{
    const n=Number(original[k]);return Number.isFinite(n)&&n>=low&&n<=high?n:defaultValue;
  };
  const restored=freshCareer();
  restored.day=Math.floor(val('day',1,1,1000000));
  restored.total=val('total',0,0,1e12);
  restored.cash=val('cash',5000,-1e12,1e12);
  restored.bestSales=val('bestSales',0,0,1e12);
  restored.stock=Math.floor(val('stock',24,0,1e9));
  restored.staff=Math.floor(val('staff',0,0,4));
  restored.staffRevision=19;restored.soloRevision=Number(original.soloRevision)||0;restored.soloRefund=Number(original.soloRefund)||0;
  // Portable backups from older versions have no schedules: keep each hired worker on full-day duty.
  restored.staffShifts=Array.from({length:4},(_,i)=>normalizeStaffShift(original.staffShifts?.[i],'full'));
  restored.exterior=Math.floor(val('exterior',0,0,5));
  restored.uniform=Math.floor(val('uniform',0,0,5));

// No streaming, downloaded music, third-party assets, or copyrighted melody.
// A quiet music-box/piano theme grows into warm string-like harmonies, then
// resolves into a bright original victory coda at the final recipe reveal.
const ENDING_BPM=91;
const ENDING_BEAT=60/ENDING_BPM;
let endingAudio=null;
const endingPitch=midi=>440*Math.pow(2,(midi-69)/12);
function endingStopMusic(fade=.12){
  const running=endingAudio;
  endingAudio=null;
  if(!running||!audioCtx)return;
  const now=audioCtx.currentTime;
  try{
    if(typeof running.bus.gain.cancelAndHoldAtTime==='function')running.bus.gain.cancelAndHoldAtTime(now);
    else{
      const current=Math.max(.0001,running.bus.gain.value);
      running.bus.gain.cancelScheduledValues(now);
      running.bus.gain.setValueAtTime(current,now);
    }
    running.bus.gain.linearRampToValueAtTime(.00001,now+fade);
  }catch(e){}
  for(const osc of running.oscillators){try{osc.stop(now+fade+.04)}catch(e){}}
  window.setTimeout(()=>{
    try{running.bus.disconnect();running.delay.disconnect();running.echoFilter.disconnect();running.echoGain.disconnect()}catch(e){}
  },Math.ceil((fade+.22)*1000));
}
function endingInstrument(midi,beat,beats,kind,loud,offset,base,bus,all){
  const startRelative=beat*ENDING_BEAT-offset;
  const endRelative=(beat+beats)*ENDING_BEAT-offset;
  if(endRelative<=.03)return;
  const now=audioCtx.currentTime;
  const start=base+Math.max(.015,startRelative);
  const end=base+Math.max(.075,endRelative);
  if(end-start<.05)return;
  const dur=end-start;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  const note=endingPitch(midi);
  osc.frequency.setValueAtTime(note,start);
  let release;
  if(kind==='strings'){
    osc.type='sawtooth';
    const filter=audioCtx.createBiquadFilter();filter.type='lowpass';
    filter.frequency.setValueAtTime(650,start);
    filter.frequency.linearRampToValueAtTime(1000,start+Math.min(1.7,dur*.5));
    osc.connect(filter);filter.connect(gain);
    release=Math.min(.62,dur*.25);
    gain.gain.setValueAtTime(.00001,start);

function endingScheduleCredits(offset,base,bus,all){
  // Entire 12-bar progression is composed for the 32s scrolling credits.
  // A minor → F major → C major → G major, twice, then a rising bridge.
  const bars=[
    [45,[57,60,64]], [41,[53,57,60]], [48,[55,60,64]], [43,[55,59,62]],
    [45,[57,60,64]], [41,[53,57,60]], [48,[55,60,64]], [43,[55,59,62]],
    [41,[53,57,60]], [43,[55,59,62]], [45,[57,60,64]], [43,[55,59,62]]
  ];
  const phrases=[
    [64,69,72,71],[69,67,69,72],[67,72,76,74],[74,71,67,67],
    [69,72,76,79],[69,72,77,76],[76,79,81,79],[74,79,83,81],
    [72,77,81,84],[74,79,83,86],[76,81,84,88],[79,83,86,79]
  ];
  for(let bar=0;bar<bars.length;bar++){
    const at=bar*4,root=bars[bar][0],chord=bars[bar][1];
    const rise=bar/11;
    endingInstrument(root,at,3.9,'bass',.050+rise*.025,offset,base,bus,all);
    chord.forEach(note=>endingInstrument(note,at,3.94,'strings',.013+rise*.010,offset,base,bus,all));
    const arp=[0,1,2,1];
    for(let beat=0;beat<4;beat++){
      endingInstrument(chord[arp[beat]]+12,at+beat,.94,'piano',.065+rise*.020,offset,base,bus,all);
    }
    for(let beat=0;beat<4;beat++){
      endingInstrument(phrases[bar][beat],at+beat,bar<3?.93:1.06,bar>=8?'bell':'melody',.066+rise*.027,offset,base,bus,all);
    }
    if(bar>=5)endingInstrument(chord[2]+24,at+2,1.35,'bell',.035+rise*.014,offset,base,bus,all);
  }
}
function endingScheduleVictory(base,bus,all){
  // A second, distinctly brighter C-major melody begins with GAME CLEAR.
  const score=[
    {root:48,chord:[60,64,67],top:[76,79,84,79]},
    {root:41,chord:[57,60,65],top:[81,79,77,76]},
    {root:43,chord:[59,62,67],top:[74,79,83,86]},
    {root:48,chord:[60,64,67],top:[84,79,76,84]},
    {root:48,chord:[60,64,67],top:[79,76,72,84]}
  ];
  for(let bar=0;bar<score.length;bar++){
    const c=score[bar],at=bar*4;
    endingInstrument(c.root,at,3.9,'bass',.078,0,base,bus,all);
    c.chord.forEach(note=>endingInstrument(note,at,3.93,'strings',.030,0,base,bus,all));
    c.top.forEach((note,i)=>endingInstrument(note,at+i,1.05,'bell',bar===0?.115:.087,0,base,bus,all));
    for(let i=0;i<4;i++)endingInstrument(c.chord[[0,2,1,2][i]]+12,at+i,.94,'piano',.071,0,base,bus,all);
  }
  // Longer resolution, followed by a natural fade. Replay can restart at any time.
  [48,55,60,64,67,72].forEach(midi=>endingInstrument(midi,19.75,7.5,midi<60?'bass':'strings',midi<60?.060:.023,0,base,bus,all));
  endingInstrument(84,20,5.4,'bell',.085,0,base,bus,all);
}
function endingStartMusic(phase='credits',offset=0){
  endingStopMusic(.065);
  if(!career.music)return;
  initAudio(true); // user taps the finale/skip/music button; Safari permits audio.
  if(!audioCtx||!master)return;
  try{
    const now=audioCtx.currentTime,base=now+.045;
    const bus=audioCtx.createGain(),delay=audioCtx.createDelay(.7);
    const echoFilter=audioCtx.createBiquadFilter(),echoGain=audioCtx.createGain();
    bus.gain.setValueAtTime(.00001,now);
    bus.gain.linearRampToValueAtTime(phase==='credits'?1.9:2.0,now+.40);
    bus.connect(master);
    delay.delayTime.value=.30;echoFilter.type='lowpass';echoFilter.frequency.value=1650;
    echoGain.gain.value=.20;
    bus.connect(delay);delay.connect(echoFilter);echoFilter.connect(echoGain);echoGain.connect(master);
    const playing={bus,delay,echoFilter,echoGain,oscillators:[],phase};
    endingAudio=playing;
    if(phase==='credits'){
      endingScheduleCredits(Math.max(0,Math.min(30,offset)),base,bus,playing.oscillators);
      // Avoid playing past the automatic grand-reveal transition.
      bus.gain.setValueAtTime(1.9,base+Math.max(.5,31.3-offset));
      bus.gain.linearRampToValueAtTime(.00001,base+Math.max(.7,31.95-offset));
    }else{
      endingScheduleVictory(base,bus,playing.oscillators);
      bus.gain.setValueAtTime(2.0,base+23);
      bus.gain.linearRampToValueAtTime(.00001,base+28);
    }
  }catch(e){endingStopMusic(.02)}
}

// V41: Older in-progress Ultracheese orders used maple before baking. Move it

function migrateUltraCheeseFinish(state){
  if(!state)return;
  const index=REC.findIndex(recipe=>recipe.n==='ウルトラチーズ');
  for(const item of [state.draft,...(state.ovens||[]),state.cut]){
    if(!item||item.recipe!==index||!Array.isArray(item.toppings))continue;

  }

const BRANCH_LIMIT=2;
function reconcileBranchCap(){
  const old=Math.max(0,Math.floor(Number(career.branches)||0));
  if(old>BRANCH_LIMIT){
    // V39 could own as many as four branches. Refund only branches above the new cap.
    let refund=0;
    for(let i=BRANCH_LIMIT+1;i<=Math.min(4,old);i++)refund+=145000*i;
    career.cash+=refund;
    career.branches=BRANCH_LIMIT;
    career.branchLimitRefund=(Number(career.branchLimitRefund)||0)+refund;
  }
  career.branchCapRevision=40;
}

function returnToTitleFromManagement(){
  stopMusic();

    if(S?.running){
      // Freeze the live day before taking an immutable snapshot of its orders,
      // clock, wages, ovens and unfinished pizzas.
      S.paused=true;
    }else{
      // A completed day has already been recorded; the next saved state should
      // be a fresh day and must not count the closed shift a second time.
      S=blank();
    }
    persist();
    existingShift={version:13,day:career.day,savedAt:Date.now(),state:JSON.parse(JSON.stringify(S))};
  }
  // Mark the session as parked on the title screen. This prevents the ordinary
  // pagehide autosave from overwriting the preserved active-shift snapshot.
  sessionStarted=false;
  S=blank();
  openingMenu();
  render();
}

function northsideShowInstallGuide(){
  const html=`<h1>📲 ホーム画面に追加</h1>
    <p>NORTHSIDE PIZZAを無料でスマホのアプリのように起動できます。</p>
    <div class="save-old-code"><b>iPhone（Safari）</b><br>① 公開されたゲームのURLをSafariで開く<br>② Safariの共有ボタンをタップ<br>③ 「ホーム画面に追加」を選ぶ<br>④ 「Webアプリとして開く」をONにして「追加」</div>
    <div class="save-old-code" style="margin-top:8px"><b>Android（Chrome）</b><br>ブラウザーのメニューから「アプリをインストール」または「ホーム画面に追加」を選択。</div>
    <div class="save-notice">⚠️ Safari版とホーム画面に追加した版では、セーブデータが別々になる場合があります。引き継ぐ前に「セーブデータの引き継ぎ・復元」からバックアップを取ってください。更新時もバックアップがおすすめです。</div>
    <button id="pwaNativeInstall" class="save-action" style="display:${northsideDeferredInstallPrompt?'block':'none'}">📲 この端末にインストール</button>
    <button id="pwaGuideBack" class="save-action secondary">↩ スタート画面に戻る</button>`;
  modal(html);
  const button=document.querySelector('#pwaNativeInstall');
  if(button)button.onclick=async()=>{
    if(!northsideDeferredInstallPrompt)return;
    try{await northsideDeferredInstallPrompt.prompt()}catch(e){}
    northsideDeferredInstallPrompt=null;
    button.style.display='none';
  };
  document.querySelector('#pwaGuideBack').onclick=openingMenu;
}
const northsideOpeningMenuBeforePWA=openingMenu;
openingMenu=function(){
  northsideOpeningMenuBeforePWA();
  const standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(standalone)return;
  if(location.protocol!=='https:' && !['localhost','127.0.0.1'].includes(location.hostname))return;
  if(document.querySelector('#pwaInstallHelp'))return;
  const target=document.querySelector('#openSaveManager')||document.querySelector('#newGame');
  if(!target)return;
  const button=document.createElement('button');
  button.id='pwaInstallHelp';button.type='button';button.className='save-action secondary pwa-install-help';
  button.textContent='📲 スマホのホーム画面に追加する方法';
  button.onclick=northsideShowInstallGuide;
  target.insertAdjacentElement('afterend',button);
};
